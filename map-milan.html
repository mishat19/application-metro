<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Carte OpenStreetMap avec Leaflet</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        #map {
            width: 100vw;
            height: 100vh;
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100%;
            margin: 0;
        }
    </style>
</head>
<body>
    <div id="map"></div>

    <script>
        // Coordonnées de Milan centre
        var map = L.map('map').setView([45.47307025505748, 9.185803211299943], 13);

        // Fond de carte OpenStreetMap
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        // Marqueur
        var marker = L.marker([45.47307025505748, 9.185803211299943]).addTo(map);
        marker.bindPopup("<b>Milan</b><br>Centre de la carte.").openPopup();
    </script>
</body>
</html>
