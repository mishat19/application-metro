<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Carte OpenStreetMap avec Leaflet</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        html, body {
            margin: 0 auto;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
        }

        #map {
            height: 100%;
            width: 100%;
        }
    </style>
</head>
<body>
    <div id="map"></div>

    <script>
        // Coordonnées de Milan centre
        var map = L.map('map').setView([45.462719, 9.188578], 13);

        // Fond de carte OpenStreetMap des transports en commun
        L.tileLayer('https://tileserver.memomaps.de/tilegen/{z}/{x}/{y}.png', {
            maxZoom: 18,
            attribution: '© OpenStreetMap contributors, ÖPNVKarte'
        }).addTo(map);

        // Marqueur
        //var marker = L.marker([45.47307025505748, 9.185803211299943]).addTo(map);
        //marker.bindPopup("<b>Milan</b><br>Réseau de métro.").openPopup();
    </script>
</body>
</html>
